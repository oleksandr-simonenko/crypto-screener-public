# =====================================================================
# КОНФИГ СКРИНЕРА v2 — здесь всё, что скрипт не может узнать сам.
# Обновляй watchlist/blacklist раз в 1–2 недели (или проси Claude
# в чате: «обнови мне config.yaml по свежим новостям»).
# Заполнено по данным на 12.07.2026.
# =====================================================================

# --- Окно поиска ------------------------------------------------------
mcap_min: 5000000          # $5M  — ниже неликвид
mcap_max: 150000000        # $150M — выше окно «до взрыва» уже закрыто
float_full_points: 0.35    # флоат <=35% = максимум баллов (у BEAT было 28.8%)
float_hard_max: 0.55       # флоат >55% = выбраковка
top_n: 15                  # сколько строк слать в Telegram
min_score: 45              # ниже порога в отчёт не попадают (лучше пусто, чем шум)

# --- Ручные бусты -----------------------------------------------------
# burn_verified: true      -> +10 баллов (ты сам видел burn-tx он-чейн)
# catalyst: "ГГГГ-ММ-ДД"   -> +10 баллов, если дата в ближайшие 8 недель
# catalyst_note: "текст"   -> подпись катализатора в отчёте
# whale_accumulation: true -> +5 баллов (Arkham/держатели растут)
watchlist:
  BTT:
    burn_type: burn
    burn_verified: true
    catalyst: null
    catalyst_note: 'ИСПОЛНЕНО: 16.10.2026 первый квартальный buyback-and-burn из 100%
      выручки децентрализованных сервисов за Q3 2026 — 21,621,611,570,729.6 BTT (~$7,600,907,
      ~2.18% total supply), токены отправлены на burn-адрес, tx-хеш в сети TRON 4d9596617780e329bbd4e644ee0dffd780ec4cf3749f324d03eb98157eb04ae5
      (crypto.news/KuCoin/TheCurrencyAnalytics 17-20.10.2026; пресс-релиз GlobeNewswire
      18-19.10.2026) — burn_verified true, burn_type burn (сожжение безвозвратное);
      запущен официальный дашборд buyback-and-burn, следующие публикации объёмов и ончейн-записей
      — около середины первого месяца каждого следующего квартала (ориентир ~середина
      января 2027), что вне 8-недельного окна, точной даты нет — catalyst null (сверено
      23.10.2026)'
  EDGE:
    burn_type: burn
    burn_verified: true
    catalyst: null
    catalyst_note: 'buyback-and-burn из выручки: выкупленный EDGE сжигается каждые 24
      часа с ончейн-публикацией (Foresight News/edgeX 03.04.2026, 2.52837M EDGE на старте);
      официальный дашборд pro.edgex.exchange/tokenomics: Buyback Burn 4.86% (нач. окт.)
      → 4.93% на 08.10.2026 (TokenPost) → 4.94% supply сожжено при $47.3M выкупа из
      торговых комиссий с апреля (innmind, 12.10.2026) — рост метрики подтверждает бёрны
      в 30-дневном окне; риск: объём выкупа падает ($23.4M в апреле → $0.6M в сентябре
      вслед за комиссиями $22.2M → $4.2M); ближайшие инсайдерские анлоки только с марта
      2027 (DropsTab), V2-апгрейд без объявленной даты — конкретных catalyst-дат в 8-недельном
      окне нет (сверено 23.10.2026)'
  HEI:
    burn_verified: false
    catalyst_note: 'последний подтверждённый бёрн — 16.5M HEI (~17% circulating), исполнен
      ончейн 17.07.2026, circulating упал с 97.76M до 81.26M (CoinMarketCap AI/0xNox);
      сверено 23.10.2026: событие вне 30-дневного окна, новых ончейн-бёрнов не найдено
      — burn_verified false; catalyst-дат в 8-недельном окне нет'
  VVV:
    burn_type: burn
    burn_verified: true
    catalyst: null
    catalyst_note: 'ончейн-бёрны продолжаются в 30-дневном окне: по данным burn-кошелька
      в сети Base за 01-17.10.2026 и Tokenomist — ежедневные бёрны из выручки (5% с
      каждой покупки API-кредитов, ~10% с подписок) плюс дискреционный бёрн 16,124 VVV
      (оценка Venice ~$414K), исполненный 07.10.2026 (insights.unlocks.app 19.10.2026);
      TokenPost 22.10.2026: за период по 21.10 сожжено 41,000 VVV при 164,000 эмитированных
      (бёрн пока не перекрывает эмиссию); этап эмиссии 2.5M→2M VVV/год исполнен 01.10.2026,
      виден ончейн на basescan (Crypto Briefing 01.10.2026), новых дат снижения эмиссии
      не объявлено — catalyst null (сверено 23.10.2026)'

