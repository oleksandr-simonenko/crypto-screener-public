# =====================================================================
# ПОЧАСОВОЙ АРХИВ ФАНДИНГА И ОТКРЫТОГО ИНТЕРЕСА (блок D2)
#
# Источник: POST https://api.hyperliquid.xyz/info {"type":"metaAndAssetCtxs"}
# Ключей не требует, прогон бесплатный. Одна отдача ~70 КБ, ~233 перпа,
# на диск ложится ~25 КБ csv в час (~600 КБ в сутки, ~18 МБ в месяц).
#
# ПОЧЕМУ КАЖДЫЙ ЧАС, А НЕ РАЗ В СУТКИ
# metaAndAssetCtxs отдаёт ТОЛЬКО текущий срез: история ОТКРЫТОГО ИНТЕРЕСА,
# цен и объёмов не восстановима ничем — ни повторным прогоном, ни платным
# ключом. Частота выбрана по невосстановимости OI. Фандинг с 02.09.2026 —
# исключение: у биржи есть fundingHistory, и пропущенные часы фандинга
# funding_logger.py ДОБИРАЕТ сам (окно 48 ч, у добранных строк пометка
# missing_oi в колонке note: ставка есть, OI за тот час честно пуст).
#
# ЧЕСТНО ПРО 24 КОММИТА В СУТКИ
# Да, этот воркфлоу делает до 24 коммитов в день, и история репозитория от
# этого шумная — соседние воркфлоу (скринер, экспорт) в своих диффах утонут,
# `git log` станет нечитаемым глазами. Это осознанная цена, а не недосмотр.
# Что мы за неё покупаем: датированный архив в самом репозитории, где у
# каждой строки есть коммит с временем и git_sha кода, которым она снята.
# Такой архив нельзя переписать задним числом незаметно — подмена строки за
# прошлый вторник потребует переписать историю git, а это видно.
# Логи Actions живут 90 дней и стираются, внешнего хранилища у проекта нет,
# а ряд нужен к вердикту 15.11.2026 и позже. Читать историю глазами
# приходится редко, а восстанавливать несуществующие данные — никогда.
# Смягчение шума: коммит делается ТОЛЬКО когда файл реально изменился, и
# все строки часа ложатся одним коммитом.
# =====================================================================
name: funding-logger

on:
  schedule:
    # :07 каждого часа — не в ноль минут: на верхушке часа Actions ставит в
    # очередь весь мир, и запуск сдвигается на непредсказуемые минуты.
    # ФАКТ 03.09.2026 (С-25): GitHub исполняет этот cron примерно 8 раз из 24
    # (первые сутки архива), остальное добирается из истории биржи.
    - cron: "7 * * * *"
    # РЕЖИМ ЭКОНОМИИ МИНУТ (С-25) — ЗАГОТОВКА, НЕ ВКЛЮЧАТЬ БЕЗ СЛОВА НАВИГАТОРА.
    # Прогноз 03.09.2026: 962–1327 мин/мес при лимите 2000 — не нужен.
    # Если включать: заменить строку выше на `- cron: "7 */2 * * *"` И перевести
    # funding_logger.py на двухчасовую сетку слотов (параметр шага слота —
    # window_slot_keys/missing_slots/slot_start считают часовой шаг). Без
    # второго шага каждый прогон добирает нечётный час всеми 233 запросами
    # (~91 с) и минут НЕ экономит: 12 × 3 мин = столько же, сколько 24 × 1 мин
    # плюс половина. Подробности и таблица — STATE.md §4.
  workflow_dispatch:

permissions:
  contents: write

# Единая очередь ВСЕХ пишущих воркфлоу проекта (пакет 02.09): два
# одновременных `git push` в один main дают конфликт, потерянный прогон и
# ложную тревогу. Группа repo-writers одна на funding/unlocks/metrics/
# screener/autoconfig/export/revolut-scan — автоматы пишут по очереди.
# cancel-in-progress: false — предыдущий прогон ДОКАЧИВАЕТ и коммитит своё,
# новый ждёт. Отменять уже сходивший в сеть прогон означало бы выбросить
# невосстановимый срез OI ради экономии минуты.
concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      # С-22 (02.09.2026): у прогона ТРИ исхода (докстринг funding_logger.py):
      #   healed  — пропуск залечен полностью -> код 0, ИНФО в Telegram шлёт
      #             САМ скрипт (токен и чат — через env шага, значения в
      #             командной строке не появляются, маскировка GitHub покрывает);
      #   partial — добор неполный -> код 2 -> шаг тревоги ниже;
      #   error   — источник/исключение -> код 1 -> шаг тревоги ниже.
      # Итог уходит в outputs шага (id: snap) — тревога читает оттуда число
      # недобранных часов, а не гадает по красному цвету.
      - name: Снять срез фандинга и открытого интереса
        id: snap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python funding_logger.py

      - name: Закоммитить час архива
        id: commit
        if: always()
        run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          # Каталога может не быть, если скрипт упал ДО первой записи: тогда
          # `git add` ругнулся бы на несуществующий путь и подменил настоящую
          # причину сбоя своей. Сбой уже виден по красному шагу выше.
          if [ ! -d data/funding ]; then
            echo "каталога data/funding нет — записывать нечего"
            exit 0
          fi
          # Явный список путей: `git add -A` подписал бы нашим сообщением
          # чужие изменения, если параллельный воркфлоу что-то оставил в дереве.
          git add data/funding
          if git diff --cached --quiet; then
            echo "нечего коммитить: новых строк за этот час нет (идемпотентность отработала)"
            exit 0
          fi
          git commit -m "funding hourly snapshot $(date -u +%Y-%m-%dT%H:00Z)"
          # Соседние воркфлоу (скринер по пн/чт, экспорт по пятницам) пишут в
          # тот же main. Три попытки rebase+push вместо одной: гонка тут
          # обычная, а потерянный час — невосстановим.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), ждём и пробуем снова"
            # Оборванный rebase оставляет репозиторий в незавершённом состоянии,
            # и следующая попытка упала бы на «rebase in progress» — то есть все
            # три попытки съел бы один и тот же мусор, а не гонка.
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ОШИБКА: не удалось запушить архив за этот час"
          exit 1

      # ЧЕСТНО: тревога почасовая, и если Hyperliquid лежит полдня, придёт
      # полдюжины одинаковых сообщений. Глушилку не ставим намеренно — у
      # проекта нет второго канала, по которому пропажу ряда было бы видно,
      # а тихо теряющий данные логгер хуже назойливого.
      # С-20: токен ТОЛЬКО через env, в командной строке шага его значения
      # нет (раннер подставляет ${{ secrets.* }} в текст скрипта ДО запуска).
      # Секрет передаётся целиком одной переменной — маскировка GitHub его
      # покрывает. Печатаем только HTTP-код: тело ответа Telegram может
      # процитировать URL запроса, а в нём сидит токен.
      # С-22: шаг срабатывает ТОЛЬКО на кодах 1/2 (исход error/partial), на
      # упавшем коммите либо на job, убитом по timeout-minutes (cancelled —
      # ревью 03.09: раньше такой прогон не давал ни outputs, ни тревоги).
      # Залеченный пропуск — код 0 и сюда не попадает: о нём скрипт сам шлёт
      # ИНФО (или оставляет ::notice::). Число недобранных часов И ПАР (С-24)
      # берётся из outputs шага snap. Текст собирается в переменной и уходит
      # через --data-urlencode: строка итога — данные, и её символы не имеют
      # права рвать тело запроса.
      - name: Тревога в Telegram при сбое
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.snap.outputs.outcome }}
          GAP_HOURS: ${{ steps.snap.outputs.gap_hours }}
          UNFILLED_HOURS: ${{ steps.snap.outputs.unfilled_hours }}
          PAIRS_MISSING: ${{ steps.snap.outputs.pairs_missing }}
          PAIRS_UNRESOLVED: ${{ steps.snap.outputs.pairs_unresolved }}
          COINS_FAILED: ${{ steps.snap.outputs.coins_failed }}
          COINS_FAILED_NAMES: ${{ steps.snap.outputs.coins_failed_names }}
          SUMMARY: ${{ steps.snap.outputs.summary }}
          SNAP_STATUS: ${{ steps.snap.outcome }}
          COMMIT_STATUS: ${{ steps.commit.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${OUTCOME}" in
            partial)
              msg="ТРЕВОГА: funding-logger — пропуск ${GAP_HOURS} ч / ${PAIRS_MISSING} пар, НЕ ДОБРАНО ${UNFILLED_HOURS} ч / ${PAIRS_UNRESOLVED} пар (монет с ошибкой ${COINS_FAILED}: ${COINS_FAILED_NAMES:-—}; код 2). ${SUMMARY}" ;;
            error)
              msg="ТРЕВОГА: funding-logger — источник недоступен или исключение (код 1): срез часа потерян, OI не восстановим. ${SUMMARY}" ;;
            ok|healed)
              msg="ТРЕВОГА: funding-logger — срез снят (исход ${OUTCOME}), но упал шаг коммита/push: час в репозиторий не лёг" ;;
            *)
              if [ "${SNAP_STATUS}" = "cancelled" ]; then
                msg="ТРЕВОГА: funding-logger прерван по таймауту job (timeout-minutes 10) до строки итога: строки уже добранных монет записаны и закоммичены, если коммит прошёл; следующий прогон продолжит добор"
              else
                msg="ТРЕВОГА: funding-logger упал без строки итога (прерван до записи результата, код 1)"
              fi ;;
          esac
          if [ "${COMMIT_STATUS}" = "failure" ]; then
            msg="${msg}; КОММИТ/PUSH НЕ ПРОШЁЛ — строки этого прогона не в репозитории"
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${msg} Лог: ${RUN_URL}")
          echo "Telegram ответил кодом ${code}"
