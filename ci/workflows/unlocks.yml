# =====================================================================
# Ежедневный календарь разлоков и листингов (блок D1).
#   * разлоки  — CDN-датасеты DefiLlama (372 протокола, горизонт 90 дней);
#   * листинги — объявления Bybit + диффы перечней символов Binance USDT-M,
#                MEXC spot и Hyperliquid перпов против вчерашнего снимка.
# Ключей НЕ требует: все источники публичные (Telegram-секреты нужны только
# для тревоги при сбое).
#
# 05:23 UTC — раньше прогона скринера (06:17 пн/чт), чтобы свежий календарь
# уже лежал в репозитории, когда скринер и аудитор начнут работу.
#
# ПОЧЕМУ ЕЖЕДНЕВНО, А НЕ ПО ПОНЕДЕЛЬНИКАМ: дифф перечней символов — факт
# «между двумя снимками». Пропущенный день не догоняется ничем: биржа не
# отдаёт историю своих перечней, и листинг, случившийся во вторник и снятый
# в среду, исчезает бесследно.
# =====================================================================
name: unlocks-listings

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Единая очередь всех пишущих воркфлоу (пакет 02.09): два прогона
# одновременно дрались бы за push в один main. Очередь, а не отмена:
# пропущенный день не восстановить.
concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Собрать календарь разлоков и листингов
        run: python unlocks_logger.py

      - name: Закоммитить csv за день
        if: always()
        run: |
          git config user.name "unlocks-bot"
          git config user.email "unlocks-bot@users.noreply.github.com"
          # Шаг стоит под if: always(), то есть работает И на упавшем скрипте —
          # чтобы то, что успело записаться, всё-таки легло в репозиторий.
          # Значит каталогов может не быть вовсе: скрипт мог упасть ДО первой
          # записи. Тогда `git add` на несуществующем пути свалился бы сам и
          # подменил настоящую причину сбоя своей — в логе краснел бы коммит,
          # а не сбор данных. Проверяем существование и берём только то, что есть.
          # Имена каталогов — константы без пробелов, поэтому список без кавычек
          # безопасен.
          PATHS=""
          for dir in data/unlocks data/listings; do
            if [ -d "$dir" ]; then
              PATHS="$PATHS $dir"
            else
              echo "каталога $dir нет — из него коммитить нечего"
            fi
          done
          if [ -z "$PATHS" ]; then
            echo "ни одного каталога с данными нет — записывать нечего"
            exit 0
          fi
          # Явный список путей, а не `git add -A`: каталог data/funding пишет
          # почасовой воркфлоу funding, и подписывать его файлы этим коммитом
          # нельзя.
          git add $PATHS
          if git diff --cached --quiet; then
            echo "нечего коммитить: календарь за этот день уже в репозитории"
            exit 0
          fi
          git commit -m "daily unlocks + listings calendar $(date -u +%Y-%m-%d)"
          # Три попытки rebase+push, как в почасовом funding.yml. Одной не
          # хватает: прогон идёт до 30 минут, за это время в main ложатся
          # коммиты скринера и до получаса почасового фандинга, и первая
          # попытка проигрывает гонку регулярно. --autostash нужен потому, что
          # rebase с непустым рабочим деревом (скрипт мог оставить временный
          # файл) отказывается стартовать вовсе.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), ждём и пробуем снова"
            # Оборванный rebase оставляет репозиторий в незавершённом состоянии,
            # и следующая попытка упала бы на «rebase in progress» — то есть все
            # три попытки съел бы один и тот же мусор, а не гонка.
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ОШИБКА: не удалось запушить календарь за этот день"
          exit 1

      # С-20: токен только через env, печатаем только HTTP-код ответа —
      # тело может процитировать URL запроса, а в нём сидит токен.
      - name: Тревога в Telegram при сбое
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="ТРЕВОГА: unlocks-listings УПАЛ — календарь за день не собран ЛИБО не запушен (сбор: код 1 = ОБА источника пусты; коммит: три попытки rebase+push не прошли). Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "Telegram ответил кодом ${code}"
