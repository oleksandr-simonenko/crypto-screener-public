name: auditor
on:
  schedule:
    - cron: "17 7 * * 6"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Метрики пересчитываются ПЕРЕД аудитом, а не читаются позавчерашние:
      # аудитор по блоку A3 не считает числа сам, он цитирует json — значит
      # json обязан быть свежим на момент аудита. Падение этого шага не должно
      # отменять аудит целиком: аудитор honestly напишет «артефакта нет».
      - name: Освежить метрики перед аудитом
        continue-on-error: true
        run: python metrics.py
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auditor.py
      # С-20: токен только через env, печатаем только HTTP-код ответа —
      # тело может процитировать URL запроса, а в нём сидит токен.
      - name: Alarm to Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="ТРЕВОГА: аудитор УПАЛ. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "Telegram ответил кодом ${code}"
