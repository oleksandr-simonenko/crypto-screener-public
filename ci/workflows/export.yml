# =====================================================================
# Еженедельный экспорт для соседнего DEX-проекта:
# топ-контракты недели + снапшот blacklist с датами событий.
# Пятница 08:17 UTC — через 3 часа после автоконфига, blacklist свежий.
# Claude API не используется, прогон бесплатный (только CoinGecko).
# =====================================================================
name: export-flows
on:
  schedule:
    - cron: "17 8 * * 5"
  workflow_dispatch:
permissions:
  contents: write
# Единая очередь всех пишущих воркфлоу (пакет 02.09): автоматы, делающие
# git push в main, пишут по очереди, а не гонками.
concurrency:
  group: repo-writers
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v5
      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Поставить зависимости
        run: pip install -r requirements.txt
      - name: Собрать экспорт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python export_flows.py
      - name: Закоммитить снапшоты в репозиторий
        if: always()
        run: |
          git config user.name "export-bot"
          git config user.email "export-bot@users.noreply.github.com"
          git add export/
          if git diff --cached --quiet; then
            echo "экспорт не изменился — коммитить нечего"
            exit 0
          fi
          git commit -m "weekly flows export"
          # Три попытки rebase+push, как в funding.yml: main делят почасовой
          # фандинг и другие автоматы, одна попытка регулярно проигрывает гонку.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), ждём и пробуем снова"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ОШИБКА: не удалось запушить экспорт"
          exit 1
      # С-20: токен только через env, печатаем только HTTP-код ответа —
      # тело может процитировать URL запроса, а в нём сидит токен.
      - name: Тревога в Telegram при сбое
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="export-flows УПАЛ — смотри логи Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "Telegram ответил кодом ${code}"
