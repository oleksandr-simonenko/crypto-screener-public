# costs.yaml — ЕДИНСТВЕННОЕ место констант издержек скринера (блок A1).
#
# ЧЕСТНО И СРАЗУ, чтобы ни одна цифра отсюда не выглядела измерением, которым
# она не является:
#   * taker_fee_bps — ИЗМЕРИМАЯ величина: публичный тариф площадки. Взята худшая
#     из наблюдаемых публичных ставок, а не средняя.
#   * slippage_bps_by_class — ДОПУЩЕНИЕ. Стакана (order book) у проекта нет, ни
#     одного реального исполнения тоже нет: сделки бумажные. Числа выбраны в
#     худшую для нас сторону и НЕ являются замером.
#   * liquidity_class_thresholds — круглые границы, назначенные, а не выведенные
#     из данных. Тоже допущение.
#   * funding — для спота ноль по устройству инструмента, а не по оценке.
#
# Отсюда правило, которое обязаны соблюдать metrics.py и verdict_1511.py:
# ЛЮБОЙ net-результат публикуется ВМЕСТЕ с таблицей чувствительности по
# sensitivity_multipliers. Одно число net без таблицы — ложная точность:
# оно выглядит замером, а внутри него сидит догадка о слиппедже.
#
# Класс ликвидности unknown (нет суточного объёма) трактуется как самый дорогой
# thin — см. costs.py. Число таких сделок обязано попадать в артефакт полем
# liq_class_fallback_n, иначе допущение спрячется.

version: 1

# Бумажные сделки турнира и портфеля A0 — спотовая покупка на $100 и продажа
# через ~60 дней. Ни плеча, ни перпа, ни шорта: отсюда и модель издержек.
instrument: spot

taker_fee_bps:
  value: 20.0
  source: >-
    Консервативная верхняя граница публичных СПОТОВЫХ тарифов площадок, где
    физически листятся микрокапы $5-150M и куда есть доступ из Норвегии:
    Bybit non-VIP spot = 0.10% и maker, и taker (официальная справка
    https://www.bybit.com/en/help-center/article/Trading-Fee-Structure ,
    сверено 01.09.2026); KuCoin LV0 и Binance VIP0 = те же 0.10%; Gate.io VIP0
    по разным сводкам 0.10-0.20% (после обновления тарифов 09.04.2026 надёжен
    только тариф в самом кабинете). Взято 0.20% = 20 бп НА СТОРОНУ, то есть
    худший из наблюдаемых сценариев, а не типичный. Множитель 0.5 из
    sensitivity_multipliers воспроизводит базовый сценарий Bybit/KuCoin 0.10%.
    ВАЖНАЯ ОГОВОРКА: розничные приложения (Revolut и подобные), каталог которых
    скринер помечает флагом revolut, берут за сделку порядок 1-1.5% плюс спред —
    это ДРУГОЙ порядок величины, и при покупке через них модель издержек надо
    пересчитывать заново, а не множить на 2. Здесь такая площадка НЕ заложена.

funding:
  # У спота фандинга нет как класса: он существует только у бессрочных фьючерсов.
  # Поле оставлено, чтобы код не пришлось менять, если когда-нибудь появится
  # дорожка на перпах — тогда applies_to_spot станет неприменимо, а ставка
  # придёт из data/funding/ (D2), уже как ИЗМЕРЕНИЕ, а не как допущение.
  applies_to_spot: false
  bps_per_day:
    value: 0.0
    source: >-
      Ноль по устройству инструмента, а не по оценке: спотовая покупка монеты
      не платит и не получает фандинг — платежи каждые 8 часов существуют
      только у бессрочных фьючерсов (perp). Проверять тут нечего; если модель
      когда-нибудь поедет на перпы, ставка берётся из фактических снапшотов
      Hyperliquid (data/funding/, блок D2), и applies_to_spot тут ни при чём.

slippage_bps_by_class:
  # НА ОДНУ СТОРОНУ (вход и выход считаются отдельно, см. round_trip_bps).
  # Цена входа/выхода в турнире — цена CoinGecko, то есть агрегат, близкий к
  # середине рынка. Значит реальная покупка идёт по asks, продажа по bids, и
  # издержка на сторону это примерно половина спреда плюс наш собственный
  # импакт. Импакт на $100 близок к нулю даже в тонком стакане; доминирует
  # спред, поэтому числа ниже — про спред, взятый широко.
  deep:
    value: 15.0
    source: >-
      Допущение, консервативное, стакан не измерялся. Ориентир: у ликвидных
      альтов с суточным оборотом выше $10M спред на крупных CEX обычно единицы
      базисных пунктов; заложено 15 бп на сторону — с запасом в несколько раз
      в худшую для нас сторону. Замером станет только сверка с реальными
      исполнениями или со снимками стакана, которых у проекта СЕЙЧАС НЕТ.
  medium:
    value: 40.0
    source: >-
      Допущение, консервативное, стакан не измерялся. Класс $1M-10M суточного
      оборота: спред обычно десятки базисных пунктов и заметно скачет в выходные
      и на тонком рынке. Заложено 40 бп на сторону.
  thin:
    value: 100.0
    source: >-
      Допущение, консервативное, стакан не измерялся. Класс ниже $1M суточного
      оборота — типичный случай для микрокапов $5-150M: спред в сотни базисных
      пунктов не редкость, а в момент паники стакан просто отсутствует. Заложено
      100 бп на сторону, то есть 2% за круг только на слиппедже. Сюда же
      попадают сделки с НЕИЗВЕСТНЫМ объёмом (класс unknown) — по принципу
      «не знаешь, считай по худшему».

liquidity_class_thresholds:
  # Границы по суточному объёму в USD (поле features.vol журнала кандидатов).
  deep_min_vol_usd: 10000000
  medium_min_vol_usd: 1000000
  source: >-
    Допущение: границы назначены круглыми ($10M и $1M суточного оборота), а не
    выведены из данных — разбиения по ИЗМЕРЕННОМУ слиппеджу у проекта нет и
    быть не может, пока нет стакана. Измерено фактом только одно: как эти
    границы делят реальные данные, причём НА ДВУХ РАЗНЫХ ПОПУЛЯЦИЯХ, и цифры
    у них расходятся — поэтому обе названы отдельно, а не смешаны.
    (1) ВСЕЛЕННАЯ СКРИНЕРА, последние 3000 строк candidates_log.jsonl
    (поле features.vol, 01.09.2026): thin 1783 / medium 964 / deep 252,
    медиана суточного оборота ~$463k, p10 ~$124, p90 ~$8.2M. То есть
    большинство монет окна $5-150M — тонкие.
    (2) ФАКТИЧЕСКИЕ СДЕЛКИ, все 421 позиция турнира и A0 на 01.09.2026:
    deep 171 (41%), unknown 151 (36%), medium 88 (21%), thin 11 (3%);
    по одним дорожкам турнира (382 позиции) картина та же — deep 41%,
    unknown 34%, medium 22%, thin 3%.
    ВЫВОД, КОТОРЫЙ ОТСЮДА СЛЕДУЕТ, И ПОПРАВКА К ПРЕЖНЕЙ ФОРМУЛИРОВКЕ:
    здесь раньше стояло «типичная сделка турнира считается по худшему
    слиппеджу». Это было НЕВЕРНО — вывод про сделки был сделан по замеру на
    вселенной. На самих сделках самый дешёвый класс — самый частый (41%), а
    по худшему классу идёт 39% (thin 3% плюс unknown 36%, который трактуется
    как thin). Так и должно быть: сита отбирают монеты с высоким отношением
    объёма к капитализации, то есть выборка заведомо ликвиднее вселенной.
    ОТДЕЛЬНО ВАЖНОЕ: 36% сделок имеют НЕИЗВЕСТНЫЙ объём и потому считаются по
    самому дорогому классу. Это не измерение, а подстановка, и её масштаб
    (больше трети сделок) обязан быть виден — счётчик liq_class_fallback_n
    в артефакте метрик существует ровно для этого.


# Размер бумажной позиции. Совпадает с виртуальными $100 турнира и портфеля A0
# (screener.py, замороженные правила v1). Нужен только для отчётов: сама модель
# издержек в bps и от размера позиции НЕ зависит — это отдельное допущение
# (импакт на $100 считается пренебрежимым, см. slippage_bps_by_class).
position_usd: 100
position_usd_source: >-
  Факт из замороженных правил турнира: виртуальные $100 на позицию, удержание
  60 дней. Не оценка, а константа протокола.

# Таблица чувствительности: во сколько раз множатся издержки в отчёте.
sensitivity_multipliers: [0.5, 1.0, 2.0]
sensitivity_multipliers_source: >-
  Назначено: 0.5 = сценарий дешёвой площадки и узкого спреда (Bybit 0.10% и
  вдвое меньший слиппедж), 1.0 = базовый консервативный, 2.0 = рынок хуже, чем
  мы думали. Диапазон нужен затем, чтобы вердикт нельзя было построить на одной
  удобной цифре: если знак результата меняется между 0.5 и 2.0, честный вывод —
  «издержки решают», а не «сито работает».

# К чему применяется множитель чувствительности: all | slippage_only.
# all — множится весь круг (комиссия, слиппедж, фандинг). Так множитель
# покрывает и неопределённость площадки (0.10% против 0.20%), и неопределённость
# спреда одним числом, а total_bps масштабируется линейно — это предсказуемо для
# всех, кто читает таблицу.
sensitivity_applies_to: all
sensitivity_applies_to_source: >-
  Назначено. Альтернативный режим slippage_only (множить только допущение о
  слиппедже, комиссию оставить как факт) поддержан кодом, но не выбран: тариф
  площадки тоже известен не окончательно (Gate.io 0.10-0.20%), и честнее
  трясти весь круг целиком.
