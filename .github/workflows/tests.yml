# =====================================================================
# ГЕЙТ НА КОД (находка ревизии 01.09.2026)
# 352 селфтеста существовали, но не запускались на Actions ни одним
# воркфлоу — регрессия в логгере или в статистике дошла бы до боевого
# прогона незамеченной.
#
# ФИЛЬТР ПО ПУТЯМ ОБЯЗАТЕЛЕН: почасовой логгер фандинга делает до 24
# коммитов в сутки в data/. Без paths-фильтра гейт запускался бы на каждом
# из них, жёг минуты Actions и приучал смотреть мимо красных прогонов.
# Здесь он срабатывает только когда меняется КОД или ТЕСТЫ.
# =====================================================================
name: tests

on:
  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "costs.yaml"
      # Все воркфлоу, а не только этот: с 02.09.2026 yml — охраняемый код
      # (tests/test_workflows.py сторожит мажоры действий, секреты в env и
      # структуру funding.yml), и правка одного funding.yml обязана гонять
      # гейт. Шума это не добавляет: почасовой фандинг коммитит только data/.
      - ".github/workflows/*.yml"
  workflow_dispatch:

jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Та же версия, что у всех боевых воркфлоу. Локально у пилота 3.14,
          # и расхождение версий уже ловилось: тест обязан идти на 3.12.
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Селфтесты
        run: python -m unittest discover -s tests -t . -v
      - name: Проверка запрещённых зависимостей
        # Весь код проекта обязан жить на stdlib + requests + PyYAML:
        # Actions ставит строго из requirements.txt, и любой numpy/scipy,
        # прошедший локально, там упадёт в боевом прогоне.
        run: |
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+(numpy|scipy|pandas|dateutil|matplotlib)" \
               --include='*.py' --exclude=config.py . ; then
            echo "НАЙДЕНА ЗАПРЕЩЁННАЯ ЗАВИСИМОСТЬ — её нет в requirements.txt"
            exit 1
          fi
          echo "запрещённых зависимостей нет"
